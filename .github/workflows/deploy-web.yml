name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build web
        run: |
          flutter build web \
            --release \
            --no-web-resources-cdn \
            --no-wasm-dry-run \
            -O2 \
            --base-href /daily-spark/

      # The gallery (gallery.html + screens/) lives in web_extra and must ship with
      # every deploy, otherwise the published site loses it and links 404.
      - name: Add gallery + patch index
        run: |
          cp -r web_extra/. build/web/
          python3 tool/patch_index.py build/web
          touch build/web/.nojekyll
          ls build/web | sort

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
